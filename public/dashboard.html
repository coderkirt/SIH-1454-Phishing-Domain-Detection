<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background:#fafafa; margin:0; }
  .container { max-width:500px; margin:80px auto; background:#fff; padding:30px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.08); text-align:center;}
  button { padding:10px 20px; background:#c0392b; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-top:20px;}
</style>
</head>
<body>
  <div class="container">
    <h2 id="welcome">Loading...</h2>
    <button id="logoutBtn">Log Out</button>
  </div>

<script>
// Check session on load — redirect to login if not authenticated
async function checkAuth() {
  const res = await fetch('/api/me');
  if (!res.ok) {
    window.location.href = '/login.html';
    return;
  }
  const data = await res.json();
  document.getElementById('welcome').textContent = `Welcome, ${data.email}!`;
}
checkAuth();

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
});
</script>
</body>
</html>
