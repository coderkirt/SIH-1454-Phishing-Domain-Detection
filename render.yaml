# PHISHEYE on Render — API + dashboard + downloadable Chrome extension zip.
# The extension cannot run in the browser as a website. The static site
# serves /phisheye-extension.zip (API URL baked in) and /extension install steps.
#
# In Render: New + → Blueprint → this repo / phisheye-update branch.

previewsEnabled: false

services:
  - type: web
    name: phisheye-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_ONLINE_CHECKS
        value: "true"
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: PHISHTANK_API_KEY
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false

  - type: web
    name: phisheye-web
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: VITE_API_URL
        fromService:
          name: phisheye-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /phisheye-extension.zip
        destination: /phisheye-extension.zip
      - type: rewrite
        source: /*
        destination: /index.html
